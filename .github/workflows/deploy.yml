name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # rebuild every hour so the GitHub, Steam, Monkeytype, Yandex Music and Claude Code data stays fresh
  # (plus a weekly keep-alive, see the last job)
  schedule:
    - cron: '0 * * * *'
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
      - run: npm run monkeytype
      - run: npm run yandex
      - run: npm run claude
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off scheduled runs after 60 days without new commits. Re-enabling this
  # workflow once a week resets that clock, so the site keeps refreshing on its own.
  keepalive:
    if: github.event.schedule == '30 2 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
